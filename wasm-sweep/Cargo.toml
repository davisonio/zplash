[package]
name = "zplash-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Zcash crypto — all with multicore disabled for WASM
sapling-crypto = { version = "0.7", default-features = false }
zcash_primitives = { version = "0.30", default-features = false, features = ["circuits"] }
zcash_proofs = { version = "0.30", default-features = false, features = ["local-prover"] }
zcash_note_encryption = "0.4"
zcash_protocol = "0.10"
zcash_transparent = "0.10"
zcash_address = "0.13"
incrementalmerkletree = "0.8"
zip32 = "0.2"

# WASM
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
bech32 = "0.11"
blake2b_simd = "1"
rand = "0.8"

[patch.crates-io]
home = { path = "patches/home" }

[profile.release]
opt-level = "s"
lto = true
